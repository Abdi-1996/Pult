name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    name: IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build device
        run: |
          set -euo pipefail
          xcodebuild \
            -project Pult.xcodeproj \
            -scheme Pult \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Pack IPA
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -path '*iphoneos*' -name 'Pult.app' -type d | head -1)
          test -n "$APP"
          echo "APP=$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/Pult.app
          zip -r Pult.ipa Payload
          ls -lh Pult.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pult.ipa
          path: Pult.ipa
          if-no-files-found: error

      - name: Upload agent
        uses: actions/upload-artifact@v4
        with:
          name: Pult-Agent
          path: |
            Agent/pult_agent.py
            Agent/requirements.txt
