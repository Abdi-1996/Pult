name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    name: iPhone Simulator
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project Pult.xcodeproj \
            -scheme Pult \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Pack .app
        run: |
          set -euo pipefail
          APP=$(find DerivedData -name 'Pult.app' -type d | head -1)
          test -n "$APP"
          mkdir -p dist
          cp -R "$APP" dist/Pult.app
          cd dist && zip -r ../Pult-simulator.zip Pult.app
          ls -lh ../Pult-simulator.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Pult-iOS-Simulator
          path: Pult-simulator.zip
          if-no-files-found: error

      - name: Upload agent
        uses: actions/upload-artifact@v4
        with:
          name: Pult-Agent
          path: |
            Agent/pult_agent.py
            Agent/requirements.txt
